<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>WatchParty Sync</title>
    <style>
      body {
        width: 320px;
        margin: 0;
        padding: 16px;
        color: #f8fafc;
        background: #111827;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      label {
        display: grid;
        gap: 6px;
        margin-bottom: 12px;
        font-size: 12px;
        color: #cbd5e1;
      }

      input,
      textarea {
        box-sizing: border-box;
        width: 100%;
        border: 1px solid #334155;
        border-radius: 6px;
        padding: 8px;
        color: #f8fafc;
        background: #0f172a;
      }

      textarea {
        min-height: 72px;
        resize: vertical;
      }

      button {
        border: 0;
        border-radius: 6px;
        padding: 9px 12px;
        color: #0f172a;
        background: #38bdf8;
        font-weight: 700;
        cursor: pointer;
      }

      .row {
        display: flex;
        gap: 8px;
      }

      .row button {
        flex: 1;
      }

      .status-card {
        display: grid;
        gap: 6px;
        margin: 12px 0;
        border: 1px solid #334155;
        border-radius: 6px;
        padding: 10px;
        background: #0f172a;
        font-size: 12px;
        color: #cbd5e1;
      }

      .status-card strong {
        color: #f8fafc;
      }

      .secondary {
        color: #f8fafc;
        background: #334155;
      }

      #status {
        min-height: 18px;
        margin-top: 12px;
        color: #bae6fd;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <label>
      Backend Socket.IO URL
      <input id="backendUrl" placeholder="https://your-backend.example.com" />
    </label>
    <label>
      Web App URL
      <input id="webAppUrl" placeholder="https://your-web-app.example.com" />
    </label>
    <label>
      Room Code
      <input id="roomCode" placeholder="ABCD23" />
    </label>
    <label>
      Extension Token
      <textarea id="token" placeholder="Paste short-lived token from the web app"></textarea>
    </label>
    <div class="row">
      <button id="save">Connect</button>
      <button id="openToken" class="secondary">Get Token</button>
    </div>
    <div class="row" style="margin-top: 8px">
      <button id="openRoom" class="secondary">Open Room</button>
      <button id="refreshToken" class="secondary">Refresh Token</button>
    </div>
    <div class="status-card">
      <div>Connection: <strong id="connectionState">Not connected</strong></div>
      <div>Provider: <strong id="providerState">Unknown</strong></div>
      <div>Video: <strong id="videoState">Unknown</strong></div>
      <div>Control: <strong id="controlState">Unknown</strong></div>
    </div>
    <div id="status"></div>
    <script src="popup.js"></script>
  </body>
</html>
